<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KALIYANM LIST · WedList</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#111827;--muted:#667085;--line:#e7eaf0;--accent:#6d5dfc;--green:#16a34a;--red:#dc2626;--amber:#d97706}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1100px;margin:auto;padding:18px}header{background:linear-gradient(135deg,#171827,#3b356f);color:#fff;border-radius:24px;padding:24px;margin-bottom:16px;box-shadow:0 10px 30px #1112}h1{margin:0;font-size:28px}header p{margin:5px 0 0;color:#d9d7ee}.status{margin-top:14px;font-size:13px;display:flex;gap:8px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#fbbf24}.dot.ok{background:#4ade80}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat,.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.stat b{display:block;font-size:25px;margin-top:4px}.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,textarea{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}#search{flex:1;min-width:210px}.btn{padding:11px 14px;border-radius:12px;background:#111827;color:white;font-weight:700}.btn.light{background:#fff;color:#111827;border:1px solid var(--line)}.btn.accent{background:var(--accent)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{position:relative}.name{font-size:17px;font-weight:800;margin-right:55px}.family{margin:4px 0 10px;color:var(--muted)}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;padding:5px 8px;border-radius:99px;background:#f0f1f5}.chip.green{background:#dcfce7;color:#166534}.chip.amber{background:#fef3c7;color:#92400e}.chip.red{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1;padding:9px;border-radius:10px;background:#f3f4f6}.empty{padding:35px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.modal.show{display:flex}.sheet{background:#fff;border-radius:22px 22px 14px 14px;width:min(600px,100%);max-height:92vh;overflow:auto;padding:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:8px 0 5px}textarea{min-height:80px;width:100%}.full{grid-column:1/-1}.close{float:right;background:#f1f2f5;border-radius:50%;width:34px;height:34px}.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions .btn{flex:1}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wrap{padding:12px}header{border-radius:18px;padding:20px}}
</style></head><body><div class="wrap"><header><h1>💍 KALIYANM LIST</h1><p>Mehjabin & Adul · Wedding Guest Manager</p><div class="status"><span id="dot" class="dot"></span><span id="sync">Connecting to Supabase…</span></div></header><section class="stats"><div class="stat"><span class="muted">Guest groups</span><b id="groups">0</b></div><div class="stat"><span class="muted">Total members</span><b id="members">0</b></div><div class="stat"><span class="muted">Confirmed</span><b id="confirmed">0</b></div><div class="stat"><span class="muted">Checked in</span><b id="checked">0</b></div></section><div class="toolbar"><input id="search" placeholder="Search name, family or phone…"><select id="filter"><option value="all">All RSVP</option><option>Pending</option><option>Confirmed</option><option>Declined</option><option value="checked">Checked in</option></select><button class="btn accent" onclick="openNew()">＋ Add guest</button><button class="btn light" onclick="load()">↻ Sync</button></div><main id="list" class="grid"></main></div><div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle">Add guest</h2><form id="form"><input type="hidden" id="id"><div class="row"><div><label>Name</label><input id="name" required></div><div><label>Members</label><input id="members" type="number" min="1" value="1" required></div><div><label>Family / group</label><input id="family"></div><div><label>Phone</label><input id="phone" inputmode="tel"></div><div><label>Side</label><select id="side"><option>Family</option><option>Bride</option><option>Groom</option><option>Friends</option><option>Other</option></select></div><div><label>RSVP</label><select id="rsvp"><option>Pending</option><option>Confirmed</option><option>Declined</option></select></div><div><label>Address</label><input id="address"></div><div><label>Food</label><input id="food"></div><div class="full"><label>Notes</label><textarea id="notes"></textarea></div></div><div class="modal-actions"><button type="button" class="btn light" onclick="closeModal()">Cancel</button><button class="btn accent">Save guest</button></div></form></div></div><script>
const SUPABASE_URL='https://eljlymnbwocrdvklaoih.supabase.co';const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoiZWpsbHltbmJ3b2NyZHZrbGFvaWgiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4OTU3Mjg3NSwiZXhwIjoyMTA1MTQ4ODc1fQ.5KM52p27bMZreTQtsDvQUP8edZJEW8S-No3quZjmyck";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let guests=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":"&#039;"}[c]));
async function load(){$('sync').textContent='Syncing…';let r=await sb.from('guests').select('*').order('family').order('name');if(r.error){$('sync').textContent='Database error: '+r.error.message;return}guests=r.data||[];render();$('dot').classList.add('ok');$('sync').textContent='Live sync connected';}
function render(){let q=$('search').value.toLowerCase(), f=$('filter').value;let a=guests.filter(g=>{let match=!q||[g.name,g.family,g.phone].join(' ').toLowerCase().includes(q);let mf=f==='all'||(f==='checked'?g.checked_in:g.rsvp===f);return match&&mf});$('groups').textContent=guests.length;$('members').textContent=guests.reduce((s,g)=>s+Number(g.members||0),0);$('confirmed').textContent=guests.filter(g=>g.rsvp==='Confirmed').reduce((s,g)=>s+Number(g.members||0),0);$('checked').textContent=guests.filter(g=>g.checked_in).reduce((s,g)=>s+Number(g.members||0),0);$('list').innerHTML=a.length?a.map(card).join(''):'<div class="empty">No guests found.</div>'}
function card(g){let c=g.rsvp==='Confirmed'?'green':g.rsvp==='Declined'?'red':'amber';return `<article class="card"><div class="name">${esc(g.name)}</div><div class="family">${esc(g.family||'Uncategorized')}</div><div class="chips"><span class="chip">👥 ${g.members}</span><span class="chip ${c}">${esc(g.rsvp)}</span>${g.checked_in?'<span class="chip green">✓ Checked in</span>':''}</div><div class="actions"><button onclick="edit('${g.id}')">Edit</button><button onclick="check('${g.id}')">${g.checked_in?'Undo check-in':'Check in'}</button>${g.phone?`<button onclick="wa('${g.id}')">WhatsApp</button>`:''}</div></article>`}
function openNew(){$('modalTitle').textContent='Add guest';$('form').reset();$('id').value='';$('members').value=1;$('rsvp').value='Pending';$('modal').classList.add('show')}
function edit(id){let g=guests.find(x=>x.id===id);if(!g)return;$('modalTitle').textContent='Edit guest';for(let k of ['id','name','members','family','phone','side','rsvp','address','food','notes'])$(k).value=g[k]??'';$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
$('form').onsubmit=async e=>{e.preventDefault();let id=$('id').value;let data={name:$('name').value.trim(),members:Number($('members').value)||1,family:$('family').value.trim()||'Uncategorized',phone:$('phone').value.trim(),side:$('side').value,rsvp:$('rsvp').value,address:$('address').value.trim(),food:$('food').value.trim(),notes:$('notes').value.trim()};let r=id?await sb.from('guests').update(data).eq('id',id):await sb.from('guests').insert(data);if(r.error)return alert(r.error.message);closeModal();load()};
async function check(id){let g=guests.find(x=>x.id===id);if(!g)return;let r=await sb.from('guests').update({checked_in:!g.checked_in}).eq('id',id);if(r.error)alert(r.error.message);else load()}
async function wa(id){let g=guests.find(x=>x.id===id);if(!g||!g.phone)return;let p=g.phone.replace(/\D/g,'');if(p.length===10)p='91'+p;let msg=`Hello ${g.name},\n\nYou are invited to the wedding of Mehjabin & Adul.\n\nWe look forward to celebrating with you! 💍`;window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank')}
$('search').oninput=render;$('filter').onchange=render;
sb.channel('guests-live').on('postgres_changes',{event:'*',schema:'public',table:'guests'},()=>load()).subscribe();load();
</script></body></html>
